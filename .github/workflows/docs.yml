# Historic filename: this workflow started as the doc-graph check and keeps its path because
# ai/rules/ prose cites it. It now runs the repo's declared merge gate, so the check is CI.
name: CI

on:
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

# Keyed on the COMMIT SHA, never on github.ref. A ref-keyed group makes a new push cancel the
# in-flight run for the previous commit, and a cancelled run reports as a cancelled blocking
# gate, i.e. unverified rather than green. Per-SHA groups only ever coalesce runs of the same
# exact tree, so nothing a reviewer is waiting on is ever cancelled out from under them.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.sha }}

jobs:
  ci:
    # PR-controlled code runs on a self-hosted runner only from branches in this repository.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # The gate is the one the justfile declares: docs + mirror + pins + test-js + test-sh.
      # Running a subset here would make a green check mean less than a green local run.
      - name: Run the declared workspace gate
        env:
          DOC_GRAPH_ALLOW_MISSING_PRIVATE_SUBMODULES: "1"
        run: just ci
